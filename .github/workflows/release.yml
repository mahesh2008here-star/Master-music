name: Build Android APK & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Web App Bundle
        run: |
          npm install
          npm run lint
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          tar -czf masterwave-web-v5.2.0.tar.gz dist/ server.ts package.json README.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-Installed Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          echo "sdk.dir=$SDK_DIR" > android/local.properties
          echo "Configured Android SDK at $SDK_DIR"

      - name: Install Gradle 8.9 & Build Signed Android APK
        working-directory: android
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9.zip
          unzip -q -o /tmp/gradle-8.9.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare Installable APK Asset
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*release*.apk" -o -name "*debug*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Gradle did not produce an APK!"
            exit 1
          fi
          cp "$APK_FILE" MasterWave-v5.2.0.apk
          ls -lh MasterWave-v5.2.0.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MasterWave-v5.2.0-APK
          path: MasterWave-v5.2.0.apk

      - name: Publish APK to GitHub Releases via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="## MasterWave Music v5.2.0 — Official Android APK Release

          ### Direct Phone Installation
          1. Download **MasterWave-v5.2.0.apk** under Assets below.
          2. Tap the downloaded APK on your phone and select **Install**."

          # Ensure v5.2.0 release exists and upload APK
          if ! gh release view v5.2.0 >/dev/null 2>&1; then
            gh release create v5.2.0 MasterWave-v5.2.0.apk masterwave-web-v5.2.0.tar.gz \
              --title "MasterWave Music v5.2.0 (Android APK)" \
              --notes "$NOTES"
          else
            gh release upload v5.2.0 MasterWave-v5.2.0.apk masterwave-web-v5.2.0.tar.gz --clobber
          fi

          # Also attach MasterWave-v5.2.0.apk to any other existing releases the user created
          for TAG in $(gh release list --limit 10 --json tagName -q '.[].tagName'); do
            if [ "$TAG" != "v5.2.0" ]; then
              gh release upload "$TAG" MasterWave-v5.2.0.apk masterwave-web-v5.2.0.tar.gz --clobber || true
            fi
          done
