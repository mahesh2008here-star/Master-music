name: Build Android APK & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Web App Bundle
        run: |
          npm install
          npm run lint
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          tar -czf masterwave-web-v5.2.0.tar.gz dist/ server.ts package.json README.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Android APK via Gradle
        working-directory: android
        run: |
          gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare Installable APK Asset
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*release*.apk" -o -name "*debug*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Gradle did not produce an APK!"
            exit 1
          fi
          cp "$APK_FILE" MasterWave-v5.2.0.apk
          ls -lh MasterWave-v5.2.0.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MasterWave-v5.2.0-APK
          path: MasterWave-v5.2.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.2.0
          name: MasterWave Music v5.2.0 (Android APK)
          body: |
            ## MasterWave Music v5.2.0 — Official Android APK Release

            ### 📱 Direct Phone Installation (No Laptop or USB Debugging Needed)
            1. Download **`MasterWave-v5.2.0.apk`** from the **Assets** section below.
            2. Open the downloaded `.apk` file on your Android phone and tap **Install**.

            ### ✨ What's Included
            - **Apple Music & Material You UI**: Liquid Glass dock, atmospheric blurred artwork, and Echo Music styled settings.
            - **Mirrored Acoustic Micro-Filament Waveform**: Hi-DPI canvas seekbar with glowing progress and touch scrubbing.
            - **YouTube Music & Spotify Co-Listening Engine**: Top Picks auto-scrolling carousel, Quick Picks, and 3-minute dynamic taste refresh.
            - **Multi-Provider Search & Entity Pages**: Unified search across Songs, Albums, Artists, Podcasts, and Playlists with full Artist & Album views.
            - **Offline Storage & Device Export**: Download songs with merged cover art and `.lrc` synced lyrics for offline playback.
          files: |
            MasterWave-v5.2.0.apk
            masterwave-web-v5.2.0.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
