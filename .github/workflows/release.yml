name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Build Web App
      run: |
        npm install
        npm run build
        tar -czf masterwave-web-dist.tar.gz dist/ server.ts package.json

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Gradle and Build Android APK
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        gradle assembleDebug
      continue-on-error: true

    - name: Locate APK
      id: find_apk
      run: |
        APK_PATH=$(find . -name "*.apk" | head -n 1 || echo "")
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        if [ -n "$APK_PATH" ]; then
          cp "$APK_PATH" masterwave-v5.2.0-debug.apk
          echo "Found APK at $APK_PATH"
        else
          echo "No APK found, packaging fallback release archive."
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          masterwave-web-dist.tar.gz
          masterwave-v5.2.0-debug.apk
        tag_name: ${{ github.ref_name }}
        name: MasterWave ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
